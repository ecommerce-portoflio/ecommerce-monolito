services:
  postgres:
    image: postgres:14
    container_name: postgres-ecommerce
    env_file:
      - db.env
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-ecommerce
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  app:
    image: marcelobezz07/ecommerce:latest
    container_name: API_ecommerce
    ports:
      - "8080:8080"
    env_file:
      - .env

volumes:
  postgres_data: